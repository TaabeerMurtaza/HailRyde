openapi: 3.0.3
info:
  title: HailRyde API
  version: 0.1.0
  description: Local ride-booking API. Authenticated routes use Authorization Bearer tokens.
servers:
  - url: http://localhost:8000
paths:
  /api/register:
    post:
      summary: Register a rider or driver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Unknown credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: These credentials do not match our records.
                  details: {}
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/logout:
    post:
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/places:
    get:
      summary: Preset Lahore places
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Places
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/estimates:
    post:
      summary: Price a trip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_place_id, destination_place_id, category]
              properties:
                pickup_place_id:
                  type: string
                destination_place_id:
                  type: string
                category:
                  $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/rides:
    get:
      summary: List rides for the signed-in rider or driver
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/RideStatus'
      responses:
        '200':
          description: Rides
          content:
            application/json:
              schema:
                type: object
                required: [rides]
                properties:
                  rides:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      summary: Create a ride
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_place_id, destination_place_id, category]
              properties:
                pickup_place_id:
                  type: string
                destination_place_id:
                  type: string
                category:
                  $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Ride created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency conflict or an active ride already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/rides/{id}:
    get:
      summary: Ride details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/rides/{id}/accept:
    post:
      summary: Accept a requested ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Accepted ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Lock timeout or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rides/{id}/cancel:
    post:
      summary: Cancel a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Cancelled ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/rides/{id}/complete:
    post:
      summary: Complete a ride
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Completed ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RideId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: The given data was invalid.
              details:
                email:
                  - The email has already been taken.
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: Unauthenticated.
              details: {}
    Forbidden:
      description: The signed-in role cannot call this route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Forbidden.
              details: {}
    NotFound:
      description: Unknown ride
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Not found.
              details: {}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    Category:
      type: string
      enum: [economy, comfort]
    RideStatus:
      type: string
      enum: [requested, accepted, completed, cancelled]
    RegisterRequest:
      type: object
      required: [name, email, password, phone, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
          minLength: 7
          maxLength: 20
        role:
          type: string
          enum: [rider, driver]
        plate:
          type: string
          maxLength: 20
          description: Required for drivers. Ignored for riders.
        category:
          $ref: '#/components/schemas/Category'
    DriverProfile:
      type: object
      required: [plate, category, status, lat, lng]
      properties:
        plate:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        status:
          type: string
          enum: [available, on_trip, offline]
        lat:
          type: string
        lng:
          type: string
    User:
      type: object
      required: [id, name, email, phone, role, driver_profile]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [rider, driver]
        driver_profile:
          oneOf:
            - $ref: '#/components/schemas/DriverProfile'
            - type: 'null'
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Place:
      type: object
      required: [id, name, lat, lng]
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: string
        lng:
          type: string
    Estimate:
      type: object
      required: [distance_km, duration_min, fare_amount, currency, pickup_eta_min]
      properties:
        distance_km:
          type: string
        duration_min:
          type: integer
        fare_amount:
          type: string
        currency:
          type: string
          enum: [PKR]
        pickup_eta_min:
          type: integer
          nullable: true
    Ride:
      type: object
      required: [id, status, category, pickup, destination, distance_km, duration_min, pickup_eta_min, fare_amount, currency, rider, driver, accepted_at, cancelled_at, completed_at]
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/RideStatus'
        category:
          $ref: '#/components/schemas/Category'
        pickup:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        distance_km:
          type: string
        duration_min:
          type: integer
        pickup_eta_min:
          type: integer
          nullable: true
        fare_amount:
          type: string
        currency:
          type: string
          enum: [PKR]
        rider:
          type: object
          required: [id, name, phone]
          properties:
            id:
              type: integer
            name:
              type: string
            phone:
              type: string
        driver:
          nullable: true
          type: object
          required: [id, name, phone, plate, category]
          properties:
            id:
              type: integer
            name:
              type: string
            phone:
              type: string
            plate:
              type: string
            category:
              $ref: '#/components/schemas/Category'
        accepted_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    RideEnvelope:
      type: object
      required: [ride]
      properties:
        ride:
          $ref: '#/components/schemas/Ride'

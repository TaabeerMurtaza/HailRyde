services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hailryde
      POSTGRES_USER: hailryde
      POSTGRES_PASSWORD: hailryde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hailryde -d hailryde"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    environment:
      APP_NAME: HailRyde
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: hailryde
      DB_USERNAME: hailryde
      DB_PASSWORD: hailryde
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
